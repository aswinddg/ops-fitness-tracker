version: '3.8'

services:
  fitness-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ops_fitness_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fitness_db
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - api_data:/app/data

  postgres:
    image: postgres:15-alpine
    container_name: ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  api_data:
    driver: local
  pg_data:
    driver: local

