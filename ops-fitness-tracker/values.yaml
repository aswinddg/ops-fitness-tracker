replicaCount: 1

image:
  repository: ghcr.io/aswinddg/ops-fitness-tracker
  tag: ci-local
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 8000

postgres:
  user: "fitness_user"
  password: "fitness_password"
  dbName: "fitness_db"
  storageSize: 1Gi

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

observability:
  alerts:
    enabled: true
    # Umbral de error (0.05 = 5%)
    highErrorRateThreshold: 0.05
    # Umbral de latencia en segundos (0.2 = 200ms)
    highLatencyThreshold: 0.2    