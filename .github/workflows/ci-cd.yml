name: Ops Fitness Tracker CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: Calidad de Código y Tests Unitarios
  # ==========================================
  lint-and-test:
    name: Lint & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-dev.txt

      - name: Análisis Estático (Linting)
        run: |
          # Detiene el build si hay errores de sintaxis o variables no usadas
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning si excede complejidad o estándares estilo
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ejecutar Pruebas Unitarias (Pytest)
        run: |
          pytest -v tests/

  # ==========================================
  # JOB 2: Escaneo de Seguridad de Imagen (DevSecOps)
  # ==========================================
  security-scan:
    name: Container Security Scan (Trivy)
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Build local de la imagen para escaneo
        run: |
          docker build -t ops-fitness-tracker:test -f docker/Dockerfile .

      - name: Escaneo de Vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ops-fitness-tracker:test'
          format: 'table'
          exit-code: '1' # Hace fallar el pipeline si encuentra vulnerabilidades críticas
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  # ==========================================
  # JOB 3: Build & Push a GHCR (Inmutabilidad)
  # ==========================================
  build-and-push:
    name: Build & Push to Registry
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer Metadata de Git (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build y Push de la Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max