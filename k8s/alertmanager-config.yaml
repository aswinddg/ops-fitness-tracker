apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: default
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'webhook-dummy'
    receivers:
    - name: 'webhook-dummy'
      webhook_configs:
      - url: 'http://localhost:8080/alert' # Aquí luego conectaremos Slack o Discord