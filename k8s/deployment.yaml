apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-fitness-api
  namespace: default
  labels:
    app: ops-fitness-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-fitness-api
  template:
    metadata:
      labels:
        app: ops-fitness-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: fitness-api
          image: ghcr.io/aswinddg/ops-fitness-tracker:latest
          imagePullPolicy: Always
          
          # --- INYECCIÓN DE OPENTELEMETRY ---
          #command: ["opentelemetry-instrument", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          # ----------------------------------

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD
          - name: DATABASE_URL
            value: "postgresql://fitness_user:$(DB_PASSWORD)@postgres-service:5432/fitness_db"
            
          # --- VARIABLES PARA CONECTAR CON TEMPO ---
          - name: OTEL_SERVICE_NAME
            value: "ops-fitness-api"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://tempo.monitoring.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          # -----------------------------------------
          
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ops-fitness-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10